name: Update AI cinematic poster

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-poster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set poster URL
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/portfolio/src/pages/home.tsx')
          text = path.read_text()
          old = 'posterUrl: "",'
          new = 'posterUrl: "https://r36oc3nmtvnwcata.public.blob.vercel-storage.com/frame6.jpg",'
          if old not in text:
              raise SystemExit('Target posterUrl entry not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-ai-cinematic-poster.yml
          git add artifacts/portfolio/src/pages/home.tsx
          git commit -m "Add AI cinematic film poster"
          git push